<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>03 · Carriles — Skate Tracker</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#0F1115; --ink2:#606A76; --ink3:#98A2AE;
    --grid:#E6E9ED; --grid2:#F3F5F7; --coral:#D9480F; --coral-soft:#FDF0E9;
    --verde:#137A4E; --rojo:#B3300B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#EFF1F3;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .board{max-width:1320px;margin:0 auto;padding:26px 20px 44px}
  .board-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12px;color:#4F5964;margin:0}
  .tradeoff{font-size:12px;line-height:1.55;color:#4F5964;max-width:560px;margin:0}
  .tradeoff b{color:var(--ink)}
  .frames{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:26px;border:1px solid #D5DAE0;
    box-shadow:0 20px 44px -24px rgba(15,17,21,.42);overflow:hidden;display:flex;flex-direction:column}
  figcaption{margin-top:9px;font-size:11px;color:#5F6B78;text-align:center;letter-spacing:.3px}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  .top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px 12px;border-bottom:1px solid var(--grid)}
  .top .t{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
  .top .v{font-size:10px;color:var(--ink3)}
  .body{flex:1;overflow:hidden;padding:16px 18px 0}
  .lead{margin:0 0 16px}
  .lead h2{font-size:18px;margin:2px 0 3px;letter-spacing:-.2px}
  .lead p{margin:0;font-size:11px;color:var(--ink2)}
  .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

  .lane{border:1px solid var(--grid);border-radius:12px;padding:11px 12px 8px;margin-bottom:11px;background:#FCFDFD}
  .lane .lh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .lane h4{margin:0;font-size:12px}
  .lane .mine{font-size:10px;font-weight:800;color:var(--coral)}
  .lane .unit{font-size:9.5px;color:var(--ink3);margin:0 0 6px}
  .ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:4px;padding:0 2px}

  .legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:11px;margin-top:12px}
  .legend div{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid2)}
  .legend .p{width:14px;font-size:10px;color:var(--ink3);text-align:right}
  .legend .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2C3540}
  .legend .me .n{color:var(--coral);font-weight:700}
  .legend .t{font-size:10px;color:var(--ink2)}

  .callout{display:flex;align-items:center;gap:11px;border:1px solid #F0C9B6;background:var(--coral-soft);border-radius:12px;padding:11px 13px;margin:2px 0 14px}
  .callout .k{font-size:26px;font-weight:800;color:var(--coral);line-height:1;letter-spacing:-1px}
  .callout .k small{display:block;font-size:8.5px;letter-spacing:.14em;color:#A8502A;font-weight:700;margin-top:3px}
  .callout p{margin:0;font-size:11.5px;line-height:1.5;color:#6B3A21}
  .callout b{color:var(--coral)}

  .sect{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px;display:flex;justify-content:space-between}
  .sect span{letter-spacing:0;text-transform:none;color:var(--ink3);font-size:10px}
  .note{font-size:10px;color:var(--ink3);line-height:1.45;margin:9px 0 0}
  .lock{border:1px dashed #C8D0D8;border-radius:12px;padding:12px 13px;background:#FAFBFC}
  .lock h4{margin:0 0 5px;font-size:12px}
  .lock p{margin:0;font-size:11px;line-height:1.5;color:var(--ink2)}
  .lock .dots3{display:flex;gap:4px;margin:9px 0 6px}
  .lock .dots3 i{width:16px;height:4px;border-radius:2px;background:#DDE3E9}
  .lock .dots3 i.on{background:var(--ink)}
  .lock .c{font-size:9.5px;letter-spacing:.08em;color:var(--ink3)}

  .tabbar{display:flex;border-top:1px solid var(--grid);background:#FAFBFC}
  .tabbar a{flex:1;text-align:center;padding:11px 0 13px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#98A2AE;text-decoration:none}
  .tabbar a[aria-current]{color:var(--ink);font-weight:800;box-shadow:inset 0 2px 0 var(--coral)}
</style>
</head>
<body>
<div class="board">
  <div class="board-head">
    <div>
      <h1>03 · Carriles</h1>
      <p class="sub">Dirección visual · la posición se ve, no se lee</p>
    </div>
    <p class="tradeoff"><b>Tradeoff:</b> el hueco con el grupo se entiende de un vistazo y sin explicación —cada prueba es un carril con el club entero—. Se pierde precisión: <b>los tiempos exactos pasan a segundo plano</b> y las etiquetas necesitan espacio.</p>
  </div>

        <nav class="tabbar">
